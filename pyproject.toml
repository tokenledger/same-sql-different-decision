[project]
name = "xsql"
version = "0.1.0"
description = "Cross-lingual selective prediction for text-to-SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "anthropic>=0.120.0",
    "huggingface-hub>=1.25.1",
    "matplotlib>=3.11.1",
    "nnsight>=0.7.0",
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=4.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xsql"]
